name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test ./...
      - name: Known vulnerabilities in Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Known vulnerabilities in shipped npm dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      # API types must match docs/openapi.yaml (the Go test checks the spec against the handlers)
      - run: npm run gen:api && git diff --exit-code src/lib/api-schema.d.ts
        working-directory: web
      # Type check, lint, build and bundle budget
      - run: npm run typecheck && npm run lint && npm run build && npm run size
        working-directory: web

  image:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check image size (≤ 30 MB)
        run: |
          docker buildx build --platform linux/amd64 --load -t ritm:ci .
          size=$(docker image inspect ritm:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -le $((30 * 1024 * 1024))
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
