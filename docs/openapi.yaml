      summary: Delete all health data
      tags:
        - Account
  /api/v1/activity/daily:
    get:
      description: |-
        Per day (default the last 30 days): steps, distance, calories, flights, exercise and stand, rings, sedentary stretch.

        API keys with scope `read` may call this operation.
      operationId: listDailyActivity
      parameters:
        - description: today, yesterday, last_7d, last_14d, last_30d, last_90d, last_365d, last_<n>d, this_week, last_week, this_month, last_month, ytd, YYYY-MM-DD or FROM..TO. Overrides from/to.
          explode: false
          in: query
          name: period
          schema:
            description: today, yesterday, last_7d, last_14d, last_30d, last_90d, last_365d, last_<n>d, this_week, last_week, this_month, last_month, ytd, YYYY-MM-DD or FROM..TO. Overrides from/to.
            examples:
              - last_30d
            type: string
        - description: First day (YYYY-MM-DD, or a period name meaning its first day)
          explode: false
          in: query
          name: from
          schema:
            description: First day (YYYY-MM-DD, or a period name meaning its first day)
            examples:
              - "2026-09-01"
            type: string
        - description: Last day (YYYY-MM-DD, or a period name meaning its last day; default today)
          explode: false
          in: query
          name: to
          schema:
            description: Last day (YYYY-MM-DD, or a period name meaning its last day; default today)
            examples:
              - "2026-09-30"
            type: string
        - description: Include steps_by_hour (24 values per day)
          explode: false
          in: query
          name: hours
          schema:
            default: true
            description: Include steps_by_hour (24 values per day)
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RangeItemsDailyActivity"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
        - apiKey: []
      summary: Daily activity
      tags:
        - Activity
      x-ritm-scopes:
        - read
  /api/v1/api-keys:
    get:
      description: All keys of the user, newest first, including revoked ones.
      operationId: listApiKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemsAPIKey"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: List API keys
      tags:
        - API keys
    post:
      description: Keys are `ritm_` + 32 random bytes; only a hash is stored, so the secret is returned once.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAPIKey"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Create an API key
      tags:
        - API keys
  /api/v1/api-keys/{id}:
    delete:
      description: Takes effect immediately.
