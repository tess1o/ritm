  /api/v1/auth/login:
    post:
      description: Starts a browser session (cookie `ritm_session`). 10 failures per IP or username in 15 minutes lock sign-in for that window.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "200":
