            description: "lat,lon: only workouts whose GPS route starts within radius_m of this point"
            examples:
              - 50.4501,30.5234
            type: string
        - description: Radius for near, in metres
          explode: false
          in: query
          name: radius_m
          schema:
            default: 200
            description: Radius for near, in metres
            format: double
            maximum: 100000
            minimum: 1
            type: number
        - description: "minLon,minLat,maxLon,maxLat: only workouts whose GPS route bounds intersect this box (minLon > maxLon crosses the antimeridian). Not combined with near"
          explode: false
          in: query
          name: bbox
          schema:
            description: "minLon,minLat,maxLon,maxLat: only workouts whose GPS route bounds intersect this box (minLon > maxLon crosses the antimeridian). Not combined with near"
            examples:
              - 30.2,50.3,30.8,50.6
            type: string
        - description: next_cursor of the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: next_cursor of the previous page
            type: string
        - description: Approximate number of points per track
          explode: false
          in: query
          name: points
          schema:
            default: 150
            description: Approximate number of points per track
            format: int64
            maximum: 2000
            minimum: 2
            type: integer
        - description: Tracks per page
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Tracks per page
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteBatch"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
