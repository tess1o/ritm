components:
  schemas:
    APIKey:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        prefix:
          type: string
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
        scope:
          enum:
            - read
            - monitor
            - ingest
          type: string
      required:
        - id
        - name
        - prefix
        - scope
        - created_at
        - last_used_at
        - revoked_at
      type: object
    Account:
      additionalProperties: false
      properties:
        timezone:
          description: IANA time zone of the user's local days (Settings, else RITM_TZ)
          examples:
            - Europe/Kyiv
          type: string
        today:
          description: Today in that zone
          format: date
          type: string
        user:
          $ref: "#/components/schemas/User"
        version:
          description: Ritm build version
          type: string
      required:
        - user
        - version
        - timezone
        - today
      type: object
    Annotation:
      additionalProperties: false
      properties:
        notes:
          maxLength: 4000
          type: string
        rpe:
          description: Rating of perceived exertion; null clears it
          format: int64
          maximum: 10
          minimum: 1
          type:
            - integer
            - "null"
      required:
        - rpe
        - notes
      type: object
    AuthConfig:
      additionalProperties: false
      properties:
        registration_enabled:
          description: Visitors may create accounts (RITM_REGISTRATION_ENABLED)
          type: boolean
      required:
        - registration_enabled
      type: object
    CalendarDay:
      additionalProperties: false
      properties:
        activity:
          description: Daily activity is stored for the day
          type: boolean
        day:
          type: string
        route:
          description: At least one of the day's workouts has a GPS route
          type: boolean
        steps:
          format: double
          type:
            - number
            - "null"
        watch:
          description: The Watch recorded the day; without it, steps come from the phone alone
          type: boolean
        workouts:
          description: Workouts that started that local day
          format: int64
          type: integer
      required:
        - day
        - activity
        - steps
        - watch
        - workouts
        - route
      type: object
    Catalog:
      additionalProperties: false
      properties:
        prompts:
          items:
            $ref: "#/components/schemas/CatalogEntry"
          type: array
        resources:
          items:
            $ref: "#/components/schemas/CatalogEntry"
          type: array
        tools:
          items:
            $ref: "#/components/schemas/CatalogTool"
          type: array
      required:
        - tools
        - resources
        - prompts
      type: object
    CatalogEntry:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
      required:
        - name
        - description
      type: object
    CatalogParam:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        required:
          type: boolean
      required:
        - name
        - description
        - required
      type: object
    CatalogTool:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        params:
          items:
            $ref: "#/components/schemas/CatalogParam"
          type: array
        title:
          type: string
      required:
        - name
        - title
        - description
        - params
      type: object
    Coverage:
      additionalProperties: false
      properties:
        db_bytes:
          format: int64
          type: integer
        row_counts:
          additionalProperties:
            format: int64
            type: integer
          type: object
        sources:
          items:
            $ref: "#/components/schemas/SourceInfo"
          type: array
        types:
          items:
            $ref: "#/components/schemas/TypeCoverage"
          type: array
        wal_bytes:
          format: int64
          type: integer
      required:
        - types
        - sources
        - db_bytes
        - wal_bytes
        - row_counts
      type: object
    CreatedAPIKey:
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        secret:
          description: "Send as Authorization: Bearer <secret>. Not retrievable later."
          examples:
            - ritm_3x…
          type: string
      required:
        - key
        - secret
      type: object
    Credentials:
      additionalProperties: false
      properties:
        password:
          maxLength: 72
          minLength: 1
          type: string
        timezone:
          description: The browser's IANA time zone; becomes the user's time zone when none is set yet
          examples:
            - Europe/Berlin
          maxLength: 64
          type: string
        username:
          examples:
            - alice
          maxLength: 64
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    DailyActivity:
      additionalProperties: false
      properties:
        active_hours:
          format: int64
          type:
            - integer
            - "null"
        active_kcal:
          format: double
          type:
            - number
            - "null"
        basal_kcal:
          format: double
          type:
            - number
            - "null"
        day:
          type: string
        distance_m:
          format: double
          type:
            - number
            - "null"
        exercise_min:
          format: double
          type:
            - number
            - "null"
        flights:
          format: double
          type:
            - number
            - "null"
        has_watch_data:
          type: boolean
        is_gym_day:
          type: boolean
        longest_sedentary_h:
          format: double
          type:
            - number
            - "null"
        rings:
          $ref: "#/components/schemas/Rings"
        stand_hours:
          format: int64
          type:
            - integer
            - "null"
        stand_min:
          format: double
          type:
            - number
            - "null"
        steps:
          format: double
          type:
            - number
            - "null"
        steps_by_hour:
          items:
            format: double
            type: number
          type: array
        summary_mismatch:
          type: boolean
        total_kcal:
          format: double
          type:
            - number
            - "null"
      required:
        - day
        - steps
        - distance_m
        - active_kcal
        - basal_kcal
        - total_kcal
        - flights
        - exercise_min
        - stand_min
        - stand_hours
        - active_hours
        - longest_sedentary_h
        - is_gym_day
        - summary_mismatch
        - has_watch_data
        - rings
      type: object
    DailyHeart:
      additionalProperties: false
      properties:
        day:
          type: string
        heart_events:
          format: int64
          type: integer
        hr_avg_bpm:
          format: double
          type:
            - number
            - "null"
        hr_max_bpm:
          format: double
          type:
            - number
            - "null"
        hr_min_bpm:
          format: double
          type:
            - number
            - "null"
        hr_sleep_avg_bpm:
          format: double
          type:
            - number
            - "null"
        hrv_sdnn_ms:
          format: double
          type:
            - number
            - "null"
        resp_rate_bpm:
          format: double
          type:
            - number
            - "null"
        resting_hr_bpm:
          format: double
          type:
            - number
            - "null"
        spo2_avg_pct:
          format: double
          type:
            - number
            - "null"
        spo2_min_pct:
          format: double
          type:
            - number
            - "null"
        vo2max_ml_kg_min:
          format: double
          type:
            - number
            - "null"
        walking_hr_bpm:
          format: double
          type:
            - number
            - "null"
        wrist_temp_dev_c:
          format: double
          type:
            - number
            - "null"
      required:
        - day
        - hr_min_bpm
        - hr_avg_bpm
        - hr_max_bpm
        - hr_sleep_avg_bpm
        - resting_hr_bpm
        - walking_hr_bpm
        - hrv_sdnn_ms
        - vo2max_ml_kg_min
        - spo2_avg_pct
        - spo2_min_pct
        - resp_rate_bpm
        - wrist_temp_dev_c
        - heart_events
      type: object
    DataCalendar:
      additionalProperties: false
      properties:
        first_day:
          description: First day with daily activity or a workout, across all data
          type:
            - string
            - "null"
        from:
          type: string
        items:
          description: Days in the range with daily activity or a workout; days without are left out
          items:
            $ref: "#/components/schemas/CalendarDay"
          type: array
        last_day:
          description: Last day with daily activity or a workout, across all data
          type:
            - string
            - "null"
        to:
          type: string
      required:
        - from
        - to
        - first_day
        - last_day
        - items
      type: object
    DayDetail:
      additionalProperties: false
      properties:
        activity:
          $ref: "#/components/schemas/DailyActivity"
        day:
          type: string
        end_ms:
          format: int64
          type: integer
        heart:
          $ref: "#/components/schemas/DailyHeart"
        hr:
          items:
            $ref: "#/components/schemas/HRPoint"
          type: array
        sleep:
          $ref: "#/components/schemas/SleepNight"
        sleep_segments:
          items:
            $ref: "#/components/schemas/SleepSegment"
          type: array
        start_ms:
          format: int64
          type: integer
        stood_hours:
          items:
            format: int64
            type: integer
          type: array
        workouts:
          items:
            $ref: "#/components/schemas/WorkoutSummary"
          type: array
      required:
        - day
        - start_ms
        - end_ms
        - activity
        - heart
        - sleep
        - stood_hours
        - hr
        - workouts
        - sleep_segments
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Freshness:
      additionalProperties: false
      properties:
        age_days:
          format: double
          type:
            - number
            - "null"
        last_checked_at:
          format: date-time
          type:
            - string
            - "null"
        last_data_at:
          format: date-time
          type:
            - string
            - "null"
        last_import_at:
          format: date-time
          type:
            - string
            - "null"
        stale:
          type: boolean
        stale_after_hours:
          format: double
          type: number
      required:
        - last_data_at
        - last_import_at
        - last_checked_at
        - age_days
        - stale
        - stale_after_hours
      type: object
    FreshnessReport:
      additionalProperties: false
      properties:
        age_days:
          format: double
          type:
            - number
            - "null"
        checked_at:
          type: string
        last_data_at:
          type:
            - string
            - "null"
        last_import_at:
          type:
            - string
            - "null"
        message:
          type: string
        stale_after_days:
          format: double
          type: number
        status:
          enum:
            - ok
            - stale
            - no_data
            - error
          type: string
      required:
        - status
        - message
        - last_data_at
        - age_days
        - stale_after_days
        - last_import_at
        - checked_at
      type: object
    FreshnessSummary:
      additionalProperties: false
      properties:
        age_days:
          format: double
          type:
            - number
            - "null"
        data_version:
          description: Goes up with every change to the data (imports, recomputes, settings, RPE and notes); a client can compare it to tell whether its cache is current
          format: int64
          type: integer
        has_sleep_data:
          description: Any night of sleep is stored (the Sleep page is shown)
          type: boolean
        last_checked_at:
          format: date-time
          type:
            - string
            - "null"
        last_data_at:
          format: date-time
          type:
            - string
            - "null"
        last_import_at:
          format: date-time
          type:
            - string
            - "null"
        stale:
          type: boolean
        stale_after_hours:
          format: double
          type: number
        workouts_first_at:
          description: Start of the first workout; null without workouts
          format: date-time
          type:
            - string
            - "null"
        workouts_last_at:
          description: End of the last workout; null without workouts
          format: date-time
          type:
            - string
            - "null"
      required:
        - has_sleep_data
        - data_version
        - workouts_first_at
        - workouts_last_at
        - last_data_at
        - last_import_at
        - last_checked_at
        - age_days
        - stale
        - stale_after_hours
      type: object
    Goals:
      additionalProperties: false
      properties:
        exercise_min:
          format: double
          type: number
        sessions_per_week:
          format: int64
          type: integer
        stand_hours:
          format: double
          type: number
        steps_per_day:
          format: double
          type: number
        use_ring_goals:
          type: boolean
      required:
        - steps_per_day
        - sessions_per_week
        - stand_hours
        - exercise_min
        - use_ring_goals
      type: object
    HRPoint:
      additionalProperties: false
      properties:
        avg_bpm:
          format: double
          type: number
        max_bpm:
          format: double
          type: number
        min_bpm:
          format: double
          type: number
        t_ms:
          format: int64
          type: integer
      required:
        - t_ms
        - avg_bpm
        - min_bpm
        - max_bpm
      type: object
    Health:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
            - error
          type: string
        version:
          type: string
      required:
        - status
        - version
      type: object
    HeartEvent:
      additionalProperties: false
      properties:
        end_ms:
          format: int64
          type: integer
        metadata:
          additionalProperties:
            type: string
          type: object
        source:
          type: string
        start_ms:
          format: int64
          type: integer
        type:
          enum:
            - high
            - low
            - irregular
          type: string
      required:
        - type
        - start_ms
        - end_ms
        - source
      type: object
    Import:
      additionalProperties: false
      properties:
        error:
          type: string
        exported_at:
          description: ExportDate of the Apple Health export
          format: date-time
          type:
            - string
            - "null"
        file_name:
          type: string
        file_size:
          format: int64
          type: integer
        finished_at:
          format: date-time
          type:
            - string
            - "null"
        full_reimport:
          type: boolean
        id:
          type: string
        progress:
          $ref: "#/components/schemas/Progress"
          description: Live progress; present while the import is queued or running
        started_at:
          format: date-time
          type:
            - string
            - "null"
        stats:
          $ref: "#/components/schemas/ImportStats"
        status:
          enum:
            - queued
            - running
            - succeeded
            - failed
          type: string
      required:
        - id
        - status
        - file_name
        - file_size
        - exported_at
        - full_reimport
        - started_at
        - finished_at
      type: object
    ImportRow:
      additionalProperties: false
      properties:
        error:
          type: string
        exported_at:
          description: ExportDate of the Apple Health export
          format: date-time
          type:
            - string
            - "null"
        file_name:
          type: string
        file_size:
          format: int64
          type: integer
        finished_at:
          format: date-time
          type:
            - string
            - "null"
        full_reimport:
          type: boolean
        id:
          type: string
        started_at:
          format: date-time
          type:
            - string
            - "null"
        stats:
          $ref: "#/components/schemas/ImportStats"
        status:
          enum:
            - queued
            - running
            - succeeded
            - failed
          type: string
      required:
        - id
        - status
        - file_name
        - file_size
        - exported_at
        - full_reimport
        - started_at
        - finished_at
      type: object
    ImportStats:
      additionalProperties: false
      properties:
        days_reaggregated:
          format: int64
          type: integer
        duration_ms:
          format: int64
          type: integer
        earliest_affected_day:
          type: string
        errors:
          items:
            type: string
          type: array
        export_date_ms:
          format: int64
          type: integer
        full_reimport:
          type: boolean
        ignored_records:
          format: int64
          type: integer
        last_data_ms:
          format: int64
          type: integer
        new_workouts:
          format: int64
          type: integer
        older_export:
          type: boolean
        routes_stored:
          format: int64
          type: integer
        summaries_changed:
          format: int64
          type: integer
        types:
          additionalProperties:
            $ref: "#/components/schemas/TypeStats"
          type: object
        warnings:
          items:
            type: string
          type: array
        workouts:
          $ref: "#/components/schemas/TypeStats"
        xml_bytes:
          format: int64
          type: integer
      required:
        - xml_bytes
        - duration_ms
        - types
        - workouts
        - summaries_changed
        - days_reaggregated
        - new_workouts
        - ignored_records
        - older_export
        - full_reimport
      type: object
    Insight:
      additionalProperties: false
      properties:
        baseline_value:
          format: double
          type:
            - number
            - "null"
        body:
          type: string
        category:
          enum:
            - activity
            - heart
            - training
            - recovery
          type: string
        created_at:
          format: date-time
          type: string
        current_value:
          format: double
          type:
            - number
            - "null"
        delta_pct:
          format: double
          type:
            - number
            - "null"
        evidence:
          additionalProperties: {}
          type: object
        id:
          format: int64
          type: integer
        metric:
          type: string
        period_end:
          type: string
        period_kind:
          enum:
            - daily
            - weekly
            - monthly
            - long_term
          type: string
        period_start:
          type: string
        polarity:
          enum:
            - positive
            - neutral
            - attention
          type: string
        rule_id:
          type: string
        title:
          type: string
      required:
        - id
        - rule_id
        - category
        - polarity
        - period_kind
        - period_start
        - period_end
        - title
        - body
        - current_value
        - baseline_value
        - delta_pct
        - evidence
        - created_at
      type: object
    InsightList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Insight"
          type: array
        truncated:
          description: More insights match; raise limit or narrow the range
          type: boolean
      required:
        - items
        - truncated
      type: object
    ItemsAPIKey:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/APIKey"
          type: array
      required:
        - items
      type: object
    ItemsHRPoint:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/HRPoint"
          type: array
      required:
        - items
      type: object
    ItemsImportRow:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ImportRow"
          type: array
      required:
        - items
      type: object
    ItemsWorkoutType:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/WorkoutType"
          type: array
      required:
        - items
      type: object
    LatLon:
      additionalProperties: false
      properties:
        lat:
          format: double
          type: number
        lon:
          format: double
          type: number
      required:
        - lat
        - lon
      type: object
    LoadDay:
      additionalProperties: false
      properties:
        acwr:
          format: double
          type:
            - number
            - "null"
        atl:
          format: double
          type:
            - number
            - "null"
        ctl:
          format: double
          type:
            - number
            - "null"
        day:
          type: string
        load:
          format: double
          type: number
        sessions:
          format: int64
          type: integer
        tsb:
          format: double
          type:
            - number
            - "null"
      required:
        - day
        - load
        - ctl
        - atl
        - tsb
        - acwr
        - sessions
      type: object
    McpInfo:
      additionalProperties: false
      properties:
        base_url:
          description: RITM_BASE_URL, empty when unset
          type: string
        catalog:
          $ref: "#/components/schemas/Catalog"
        path:
          description: Path of the MCP endpoint (streamable HTTP, Bearer key with scope read)
          examples:
            - /mcp
          type: string
      required:
        - path
        - base_url
        - catalog
      type: object
    MonthVolume:
      additionalProperties: false
      properties:
        hours:
          format: double
          type: number
        month:
          type: string
        sessions:
          format: int64
          type: integer
      required:
        - month
        - sessions
        - hours
      type: object
    NewAPIKey:
      additionalProperties: false
      properties:
        name:
          examples:
            - iPhone Shortcut
          maxLength: 80
          minLength: 1
          type: string
        scope:
          description: "read: health data over the REST API and the MCP server; ingest: upload exports and read their status; monitor: data freshness (Uptime Kuma)"
          enum:
            - read
            - ingest
            - monitor
          type: string
      required:
        - name
        - scope
      type: object
    Overview:
      additionalProperties: false
      properties:
        active_kcal_per_day:
          $ref: "#/components/schemas/Stat"
        asleep_min_per_night:
          $ref: "#/components/schemas/Stat"
        baseline_from:
          type: string
        baseline_to:
          type: string
        distance_m_per_day:
          $ref: "#/components/schemas/Stat"
        exercise_min_per_day:
          $ref: "#/components/schemas/Stat"
        freshness:
          $ref: "#/components/schemas/Freshness"
        from:
          type: string
        goals:
          additionalProperties:
            format: double
            type: number
          type: object
        has_sleep_data:
          type: boolean
        hrv_sdnn_ms:
          $ref: "#/components/schemas/Stat"
        insights:
          items:
