          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
        - apiKey: []
      summary: GPS tracks of many workouts
      tags:
        - Workouts
      x-ritm-scopes:
        - read
