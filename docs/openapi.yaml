              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Import history
      tags:
        - Imports
    post:
      description: |-
        Upload `export.zip` (or a bare `export.xml`) from Health → profile → Export All Health Data, as the raw request body (any content type; set `X-File-Name`) or as the first file of a multipart form. The body is streamed to disk and imported in the background; only new data is stored (G2). Follow progress at `/imports/{id}` or `/imports/{id}/events`. While another user's import holds the server-wide slot (RITM_MAX_CONCURRENT_IMPORTS), the import waits as `queued`. Works with an iPhone Shortcut: Get Contents of URL, method POST, header `Authorization: Bearer <ingest key>`, request body File.

        API keys with scope `ingest` may call this operation.
      operationId: createImport
      parameters:
        - description: "Full re-import: ignore what was imported before"
          explode: false
          in: query
          name: full
          schema:
            description: "Full re-import: ignore what was imported before"
            type: boolean
        - description: File name, URL-encoded (for raw bodies; multipart uses the part's file name)
          in: header
          name: X-File-Name
          schema:
            description: File name, URL-encoded (for raw bodies; multipart uses the part's file name)
            examples:
              - export.zip
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
          application/xml:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
          application/zip:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
          multipart/form-data:
            schema:
              properties:
                file:
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              required:
                - file
              type: object
        description: The export file
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
          description: Accepted
          headers:
            Location:
              schema:
                description: URL of the import's status
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
