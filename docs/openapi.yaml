  /api/v1/imports/{id}/events:
    get:
      description: |-
        Server-sent events: `progress` while the import runs, then one `done` with the final import. For an import that is not running, `done` (or `error`) is sent at once. Comments keep the connection alive every 15 s.

        API keys with scope `ingest` may call this operation.
      operationId: streamImportEvents
      parameters:
        - description: Import id (UUID)
          in: path
          name: id
          required: true
          schema:
            description: Import id (UUID)
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/Import"
                        event:
                          const: done
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event done
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/ErrorModel"
                        event:
                          const: error
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event error
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Progress"
                        event:
                          const: progress
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event progress
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
        - apiKey: []
      summary: Import progress stream
      tags:
        - Imports
      x-ritm-scopes:
        - ingest
