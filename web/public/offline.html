<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1115" />
    <title>Ritm — offline</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0f1115; color: #e6e8eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center; }
      p { color: #b4bac5; }
      button { min-height: 44px; padding: 0 18px; border-radius: 9px; border: 0; background: #7aa2ff; color: #0b1020; font-weight: 600; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Ritm needs a connection to your server.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
